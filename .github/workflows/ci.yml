name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-tests:
    name: Fast tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install --editable ".[dev]"

      - name: Run fast tests
        run: PYTHONPATH=src python -m pytest tests/test_api.py tests/test_model_service.py -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t fraud-risk-engine:ci .
