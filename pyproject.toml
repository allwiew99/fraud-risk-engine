[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"


[project]
name = "fraud-risk-engine"
version = "0.1.0"
description = "Production fraud risk prediction service"
requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "pydantic==2.13.4",
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
    "xgboost==3.4.1",
    "joblib==1.5.3",
    "google-cloud-storage==3.13.1",
]


[project.optional-dependencies]
release = [
    "mlflow==3.15.1",
]
dev = [
    "pytest==9.1.1",
    "httpx2",
    "mlflow==3.15.1",
    "mypy==2.3.1",
    "ruff==0.16.8",
]


[project.scripts]
fraud-risk-export-model = "fraud_risk.release_export:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = [
    "tests/test_api.py",
    "tests/test_deploy_workflow.py",
    "tests/test_load_test.py",
    "tests/test_model_service.py",
    "tests/test_observability.py",
    "tests/test_release_manifest.py",
    "tests/test_model_bundle.py",
    "tests/test_release_export.py",
    "tests/test_smoke_cloud_run.py",
]
markers = [
    "integration: requires a running MLflow server and real model artifacts",
]


[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
